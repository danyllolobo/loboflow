name: loboflow

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loboflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loboflow_secure_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-loboflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loboflow} -d ${POSTGRES_DB:-loboflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loboflow-network

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loboflow-network

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-loboflow}:${POSTGRES_PASSWORD:-loboflow_secure_pwd}@postgres:5432/${POSTGRES_DB:-loboflow}?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      APP_URL: ${APP_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-none}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - loboflow-network

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-loboflow}:${POSTGRES_PASSWORD:-loboflow_secure_pwd}@postgres:5432/${POSTGRES_DB:-loboflow}?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - loboflow-network

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_URL: /api/v1
    restart: always
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - loboflow-network

networks:
  loboflow-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
